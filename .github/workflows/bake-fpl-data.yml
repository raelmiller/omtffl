name: Bake FPL data

on:
  workflow_dispatch: {}
  schedule:
    # 05:00 UTC daily through August (pre-draft window); harmless after
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bake dataset
        run: python draft-advisor/scripts/bake_fpl_data.py

      - name: Rebuild derived data + standalone advisor
        run: |
          cd draft-advisor
          pip install --quiet openpyxl
          python scripts/ingest_draft_history.py
          python scripts/build_player_breakdown.py
          python scripts/build_manager_dossiers.py
          python scripts/fit_price_model.py
          python scripts/build_standalone.py

      - name: Commit refreshed data + tool
        run: |
          git config user.name "fpl-data-bot"
          git config user.email "actions@github.com"
          git add draft-advisor/data/*.json draft-advisor/dossiers.html draft-advisor/advisor-standalone.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh FPL data + standalone advisor ($(date -u +%Y-%m-%d))"
            git push
          fi
