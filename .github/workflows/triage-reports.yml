name: Answer player reports

# Reports are answered from facts the app has already worked out, so this is a
# small job: pull what is waiting, write a reply from the findings, post it
# back. It never touches the repository, which is why it needs no write
# permission and cannot open a pull request — fixing bugs is a separate job
# with a separate gate.
on:
  schedule:
    # Hourly. Nobody in a 14-person league is waiting on a sub-hour reply, and
    # an idle run costs one API call that returns an empty list.
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Draft replies to the log without sending them"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: triage-reports
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    # No point starting a model run to find nothing waiting, and no point
    # having the secrets checked out on a fork.
    if: github.repository == 'raelmiller/omtffl'
    steps:
      - uses: actions/checkout@v4

      # A missing secret should say so. Without this the first sign of one is
      # `curl: (3) URL rejected: No host part in the URL`, which is a poor way
      # to find out you skipped a box.
      - name: Check the secrets are set
        run: |
          missing=""
          [ -z "${{ secrets.APP_URL }}" ] && missing="$missing APP_URL"
          [ -z "${{ secrets.AGENT_TOKEN }}" ] && missing="$missing AGENT_TOKEN"
          [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Not set:$missing. Add them under Settings →"\
                 " Secrets and variables → Actions. AGENT_TOKEN must match the"\
                 " one in Railway exactly, or the app answers 404."
            exit 1
          fi

      - name: Is anything waiting?
        id: waiting
        env:
          APP_URL: ${{ secrets.APP_URL }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -euo pipefail
          # A trailing slash makes the path "//agent/reports", which 404s and
          # looks exactly like a token that does not match.
          APP_URL="${APP_URL%/}"
          if ! briefs=$(curl -fsS -H "Authorization: Bearer $AGENT_TOKEN" \
                          "$APP_URL/agent/reports?state=open"); then
            echo "::error::Could not read $APP_URL/agent/reports."
            # A length is not the secret, so it prints. Compare it with
            # agent.token_chars on $APP_URL/health: different lengths mean
            # the two copies are different strings, which is the usual cause.
            echo "This copy of AGENT_TOKEN is ${#AGENT_TOKEN} characters."
            echo "Check $APP_URL/health — agent.configured false means Railway"
            echo "has none; a different agent.token_chars means they differ."
            exit 1
          fi
          count=$(printf '%s' "$briefs" | python3 -c \
                    'import json,sys; print(len(json.load(sys.stdin)["reports"]))')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          printf '%s' "$briefs" > briefs.json
          echo "$count report(s) waiting"

      - uses: actions/setup-node@v4
        if: steps.waiting.outputs.count != '0'
        with:
          node-version: "22"

      # The model decides; the shell acts. Two reasons, and the second is
      # the one that matters: a decision written to a file cannot post
      # anything by accident, so the secrets never go near the model and
      # DRY_RUN is honoured by the shell rather than by asking a model to
      # remember a flag. The first is duller — the tool sandbox does not
      # expand environment variables inside a permitted command, so a model
      # told to curl "$APP_URL" spent its turn asking for the value.
      - name: Decide what to say
        if: steps.waiting.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          if [ -n "${ANTHROPIC_WORKSPACE_ID:-}" ]; then
            export ANTHROPIC_CUSTOM_HEADERS="anthropic-workspace-id: $ANTHROPIC_WORKSPACE_ID"
          fi
          claude -p "$(cat <<'PROMPT'
          Read .github/agent/triage.md and follow it exactly.

          The reports waiting are in briefs.json in the working directory.

          Write your decisions to decisions.json and do nothing else. No
          network calls — something downstream makes them. The file is:

          {"decisions": [
            {"report_id": 1, "action": "reply", "lane": "answer",
             "text": "what the manager reads"},
            {"report_id": 2, "action": "hold", "lane": "escalate",
             "text": "one line for the commissioner"}
          ]}

          One entry per brief, every brief, no other keys.
          PROMPT
          )" \
            --allowedTools "Read,Write" \
            --model claude-haiku-4-5

      # Posting is the shell's job, so a dry run is a fact rather than a
      # promise, and a malformed decision is caught before it reaches anyone.
      - name: Say it
        if: steps.waiting.outputs.count != '0'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL%/}"
          python3 .github/agent/post_decisions.py
